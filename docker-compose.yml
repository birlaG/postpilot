name: postpilot

x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
  volumes:
    - media:/app/media

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_plans && python manage.py seed_categories &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Separate queues so a slow platform never blocks generation (PRD section 12)
  worker-generate:
    <<: *app
    command: celery -A config worker -Q generate,ingest -c 2 -n generate@%h --loglevel=INFO

  worker-publish:
    <<: *app
    command: celery -A config worker -Q publish -c 2 -n publish@%h --loglevel=INFO

  beat:
    <<: *app
    command: celery -A config beat --loglevel=INFO --schedule /tmp/celerybeat-schedule

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - certs:/etc/letsencrypt
      - acme:/var/www/certbot

  certbot:
    image: certbot/certbot
    profiles: ["ops"]
    volumes:
      - certs:/etc/letsencrypt
      - acme:/var/www/certbot
    entrypoint: ["certbot"]
    command: ["renew"]

volumes:
  pgdata:
  redisdata:
  media:
  certs:
  acme:
